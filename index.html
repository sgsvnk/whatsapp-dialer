  <body>
    <header class="app-header">
      <img class="app-logo" src="./images/favicons/android-chrome-192x192.png" alt="WhatsApp Dialer logo" />
      <div class="app-titles">
        <h1 class="app-title">WhatsApp Dialer</h1>
        <p class="app-tagline">Message any number without saving it as a contact</p>
      </div>
    </header>

    <main class="app-main">
      <form class="dial-card" id="dialForm" novalidate>
        <label class="field-label" for="phoneNumber">Phone number</label>

        <div class="input-row">
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            inputmode="tel"
            autocomplete="tel"
            placeholder="+91 98765 43210"
            aria-describedby="dialHint"
          />
          <button type="button" id="pasteButton" class="paste-button" title="Paste from clipboard" aria-label="Paste number from clipboard">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
            </svg>
          </button>
        </div>

        <p class="field-hint" id="dialHint">Include the country code, e.g. +1 or +91. Spaces and hyphens are fine.</p>

        <button type="submit" id="submitButton" class="submit-button">
          Send WhatsApp Message <span aria-hidden="true">&rarr;</span>
        </button>
      </form>
    </main>

    <footer class="app-footer">
      <span class="footer-love">Use this often? <span aria-hidden="true">❤️</span></span>
      <nav class="footer-links">
        <a class="footer-link" href="https://support.google.com/chrome/answer/9658361?hl=en&co=GENIE.Platform%3DAndroid" target="_blank" rel="noopener">Add to your home screen</a>
